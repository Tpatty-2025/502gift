<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>神秘禮物箱</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    background: #f6f6f4;
    color: #444;
}

/* =========================
   標題
========================= */

.header {
    text-align: center;
    padding: 50px 20px 35px;
}

.header h1 {
    margin: 0;
    font-size: 40px;
    font-weight: 700;
    color: #555;
}

.header p {
    margin-top: 10px;
    color: #999;
    font-size: 17px;
}


/* =========================
   編輯按鈕
========================= */

.edit-button {
    position: fixed;
    right: 20px;
    top: 20px;

    border: none;
    background: white;
    color: #666;

    padding: 10px 17px;

    border-radius: 999px;

    font-size: 15px;

    cursor: pointer;

    box-shadow: 0 3px 12px rgba(0,0,0,0.08);

    z-index: 20;
}

.edit-button:hover {
    background: #eeeeec;
}


/* =========================
   神秘箱
========================= */

.box-container {
    max-width: 1000px;
    margin: auto;

    display: flex;
    justify-content: center;

    gap: 25px;

    padding: 10px 20px 60px;

    flex-wrap: wrap;
}


.box-card {
    width: 285px;

    background: white;

    border-radius: 25px;

    padding: 30px 20px;

    text-align: center;

    box-shadow: 0 5px 20px rgba(0,0,0,0.07);

    transition: 0.25s;
}

.box-card:hover {
    transform: translateY(-6px);

    box-shadow: 0 10px 25px rgba(0,0,0,0.11);
}


.box-icon {
    font-size: 95px;

    cursor: pointer;

    margin-bottom: 10px;

    transition: 0.2s;
}

.box-icon:hover {
    transform: scale(1.08);
}


.box-name {
    font-size: 26px;

    font-weight: bold;

    margin-bottom: 22px;
}


.small .box-name {
    color: #73a566;
}

.medium .box-name {
    color: #638db8;
}

.large .box-name {
    color: #986fb0;
}


.draw-button {
    border: none;

    border-radius: 999px;

    padding: 11px 30px;

    font-size: 17px;

    background: #555;

    color: white;

    cursor: pointer;
}

.draw-button:hover {
    opacity: 0.85;
}


/* =========================
   抽獎視窗
========================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.45);

    justify-content: center;

    align-items: center;

    z-index: 100;
}


.modal-content {
    width: min(90%, 460px);

    background: white;

    border-radius: 28px;

    padding: 35px 25px;

    text-align: center;
}


.modal-box {
    font-size: 110px;

    margin: 5px 0 20px;
}


.shaking {
    animation: shake 0.12s infinite;
}


@keyframes shake {

    0% {
        transform: rotate(-6deg);
    }

    50% {
        transform: rotate(6deg);
    }

    100% {
        transform: rotate(-6deg);
    }

}


.drawing {
    font-size: 22px;

    color: #999;
}


.result {
    display: none;
}


.result-title {
    font-size: 22px;

    color: #999;

    margin-bottom: 10px;
}


.result-name {
    font-size: 34px;

    font-weight: bold;

    color: #555;

    margin: 10px 0 25px;
}


.close-button {
    border: none;

    border-radius: 999px;

    background: #555;

    color: white;

    padding: 10px 30px;

    font-size: 16px;

    cursor: pointer;
}


/* =========================
   編輯視窗
========================= */

.edit-modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.45);

    z-index: 200;

    overflow-y: auto;

    padding: 30px 15px;
}


.edit-content {
    max-width: 650px;

    margin: auto;

    background: white;

    border-radius: 28px;

    padding: 30px;
}


.edit-content h2 {
    text-align: center;

    margin-top: 0;

    color: #555;
}


.edit-section {
    background: #f7f7f5;

    border-radius: 18px;

    padding: 18px;

    margin-bottom: 18px;
}


.edit-section h3 {
    margin-top: 0;

    font-size: 21px;
}


.small-title {
    color: #73a566;
}

.medium-title {
    color: #638db8;
}

.large-title {
    color: #986fb0;
}


.prize-row {
    display: flex;

    gap: 8px;

    margin-bottom: 8px;
}


.prize-row input {
    flex: 1;

    border: 1px solid #ddd;

    border-radius: 10px;

    padding: 10px 12px;

    font-size: 16px;

    outline: none;

    background: white;
}


.prize-row input:focus {
    border-color: #aaa;
}


.delete-prize {
    width: 42px;

    border: none;

    background: #e8e8e6;

    border-radius: 10px;

    cursor: pointer;

    font-size: 16px;
}


.delete-prize:hover {
    background: #ddd;
}


.add-prize {
    border: 1px dashed #aaa;

    background: white;

    border-radius: 999px;

    padding: 8px 18px;

    cursor: pointer;

    margin-top: 5px;

    color: #666;
}


.add-prize:hover {
    background: #eee;
}


.edit-buttons {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 25px;
}


.save-button,
.cancel-button {

    border: none;

    border-radius: 999px;

    padding: 11px 30px;

    font-size: 16px;

    cursor: pointer;
}


.save-button {
    background: #555;

    color: white;
}


.cancel-button {
    background: #eee;

    color: #555;
}


/* =========================
   手機
========================= */

@media (max-width: 650px) {

    .header h1 {
        font-size: 31px;
    }

    .box-card {
        width: 90%;

        max-width: 330px;
    }

    .edit-button {
        position: static;

        display: block;

        margin: 15px auto;
    }

}

</style>

</head>


<body>


<!-- =========================
     標題
========================= -->

<div class="header">

    <h1>🎁 神秘禮物箱</h1>

    <p>選擇一個箱子，看看今天的幸運禮物！</p>

</div>


<!-- =========================
     三個神秘箱
========================= -->

<div class="box-container">


    <!-- 小神秘箱 -->

    <div class="box-card small">

        <div class="box-icon"
             onclick="drawPrize('small')">

            🎁

        </div>

        <div class="box-name"
             id="smallName">

            小神秘箱

        </div>

        <button class="draw-button"
                onclick="drawPrize('small')">

            開始抽獎

        </button>

    </div>


    <!-- 中神秘箱 -->

    <div class="box-card medium">

        <div class="box-icon"
             onclick="drawPrize('medium')">

            🎁

        </div>

        <div class="box-name"
             id="mediumName">

            中神秘箱

        </div>

        <button class="draw-button"
                onclick="drawPrize('medium')">

            開始抽獎

        </button>

    </div>


    <!-- 大神秘箱 -->

    <div class="box-card large">

        <div class="box-icon"
             onclick="drawPrize('large')">

            🎁

        </div>

        <div class="box-name"
             id="largeName">

            大神秘箱

        </div>

        <button class="draw-button"
                onclick="drawPrize('large')">

            開始抽獎

        </button>

    </div>

</div>


<!-- =========================
     抽獎視窗
========================= -->

<div class="modal"
     id="drawModal">

    <div class="modal-content">


        <div class="modal-box"
             id="modalBox">

            🎁

        </div>


        <div class="drawing"
             id="drawingText">

            抽獎中……

        </div>


        <div class="result"
             id="result">

            <div class="result-title">

                🎉 恭喜你！

            </div>


            <div class="result-name"
                 id="resultName">

                神秘禮物

            </div>

        </div>


        <button class="close-button"
                onclick="closeDraw()">

            關閉

        </button>

    </div>

</div>


<!-- =========================
     編輯視窗
========================= -->

<div class="edit-modal"
     id="editModal">


    <div class="edit-content">


        <h2>
            ⚙️ 編輯禮品項目
        </h2>


        <!-- 小箱 -->

        <div class="edit-section">

            <h3 class="small-title">
                🌱 小神秘箱
            </h3>

            <div id="smallPrizes"></div>

            <button class="add-prize"
                    onclick="addPrize('small')">

                ＋ 新增禮品

            </button>

        </div>


        <!-- 中箱 -->

        <div class="edit-section">

            <h3 class="medium-title">
                💎 中神秘箱
            </h3>

            <div id="mediumPrizes"></div>

            <button class="add-prize"
                    onclick="addPrize('medium')">

                ＋ 新增禮品

            </button>

        </div>


        <!-- 大箱 -->

        <div class="edit-section">

            <h3 class="large-title">
                👑 大神秘箱
            </h3>

            <div id="largePrizes"></div>

            <button class="add-prize"
                    onclick="addPrize('large')">

                ＋ 新增禮品

            </button>

        </div>


        <div class="edit-buttons">

            <button class="cancel-button"
                    onclick="closeEdit()">

                取消

            </button>


            <button class="save-button"
                    onclick="savePrizes()">

                儲存

            </button>

        </div>


    </div>

</div>


<script>


/* =========================
   預設禮品
========================= */

let prizes = {

    small: [
        "橡皮擦",
        "自動鉛筆或原子筆",
        "螢光筆",
        "筆記本",
        "便利貼",
        "榮譽卡15點",
        "點數銀行＋600點"
        
    ],

    medium: [
        "蠟筆組",
        "文具組",
        "特色原子筆",
        "可愛吊飾",
        "點數銀行＋800點"
        "榮譽卡30點"
    ],

    large: [
        "高級自動鉛筆",
        "豪華文具組",
        "特色筆記本",
        "銀行點數＋1000點",
        "榮譽卡50點"
    ]

};


/* =========================
   讀取之前儲存的禮品
========================= */

const saved =
    localStorage.getItem(
        "mysteryGiftPrizes"
    );


if (saved) {

    prizes = JSON.parse(saved);

}


/* =========================
   建立編輯按鈕
========================= */

const editButton =
    document.createElement("button");

editButton.className =
    "edit-button";

editButton.innerText =
    "⚙️ 編輯禮品";

editButton.onclick =
    openEdit;

document.body.appendChild(editButton);


/* =========================
   開啟編輯
========================= */

function openEdit() {

    document.getElementById("editModal")
        .style.display = "block";


    renderList("small");

    renderList("medium");

    renderList("large");

}


/* =========================
   顯示禮品清單
========================= */

function renderList(type) {

    const container =
        document.getElementById(
            type + "Prizes"
        );


    container.innerHTML = "";


    prizes[type].forEach(
        (prize, index) => {

            const row =
                document.createElement("div");

            row.className =
                "prize-row";


            const input =
                document.createElement("input");

            input.type = "text";

            input.value = prize;

            input.id =
                type + "-" + index;


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete-prize";

            deleteButton.innerText =
                "🗑";


            deleteButton.onclick =
                function() {

                    deletePrize(
                        type,
                        index
                    );

                };


            row.appendChild(input);

            row.appendChild(deleteButton);

            container.appendChild(row);

        }
    );

}


/* =========================
   新增禮品
========================= */

function addPrize(type) {

    prizes[type].push("新禮品");

    renderList(type);

}


/* =========================
   刪除禮品
========================= */

function deletePrize(type, index) {

    prizes[type].splice(index, 1);

    renderList(type);

}


/* =========================
   儲存
========================= */

function savePrizes() {

    ["small", "medium", "large"]
        .forEach(type => {

            const inputs =
                document.querySelectorAll(
                    "#" + type + "Prizes input"
                );


            prizes[type] =
                Array.from(inputs)
                .map(input =>
                    input.value.trim()
                )
                .filter(value =>
                    value !== ""
                );

        });


    localStorage.setItem(
        "mysteryGiftPrizes",
        JSON.stringify(prizes)
    );


    closeEdit();

}


/* =========================
   關閉編輯
========================= */

function closeEdit() {

    document.getElementById("editModal")
        .style.display = "none";

}


/* =========================
   抽獎
========================= */

function drawPrize(type) {

    if (prizes[type].length === 0) {

        alert("這個神秘箱目前沒有禮品！");

        return;

    }


    const modal =
        document.getElementById("drawModal");

    const box =
        document.getElementById("modalBox");

    const drawing =
        document.getElementById("drawingText");

    const result =
        document.getElementById("result");


    modal.style.display = "flex";


    box.innerText = "🎁";

    box.classList.add("shaking");


    drawing.style.display = "block";

    result.style.display = "none";


    /* 隨機抽一個禮品 */

    const randomIndex =
        Math.floor(
            Math.random() *
            prizes[type].length
        );


    const selectedPrize =
        prizes[type][randomIndex];


    /* 抽獎動畫 */

    setTimeout(function() {

        box.classList.remove("shaking");

        box.innerText = "🎉";

        drawing.style.display = "none";

        result.style.display = "block";


        document.getElementById(
            "resultName"
        ).innerText =
            selectedPrize;


    }, 1800);

}


/* =========================
   關閉抽獎
========================= */

function closeDraw() {

    document.getElementById("drawModal")
        .style.display = "none";

}

</script>


</body>
</html>
